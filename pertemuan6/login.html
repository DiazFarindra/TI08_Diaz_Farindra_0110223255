<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Tugas RWD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/tailwind.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="site-shell space-y-4 sm:space-y-5">
      <header class="section-card"><h1 class="text-2xl sm:text-3xl">Login Form</h1><p class="mt-1 text-sm text-base-700">login.html content</p></header>
      <nav class="section-card" aria-label="Navigation Menu"><div class="flex flex-wrap gap-2"><span class="rounded-lg bg-base-900 px-3 py-2 text-sm font-bold tracking-wide text-white">NF</span><a data-nav class="nav-link" href="index.html">Home</a><a data-nav class="nav-link" href="home.html">Profile</a><a data-nav class="nav-link" href="study.html">MyStudy</a><a data-nav class="nav-link" href="gallery.html">Gallery</a><a data-nav class="nav-link" href="datatables.html">Datatable</a><a data-nav class="nav-link" href="login.html">Login</a></div></nav>
      <main id="main-content" class="grid gap-4 md:grid-cols-12">
        <aside class="section-card md:col-span-4"><h2 class="text-lg">Content</h2><ul class="mt-3 space-y-2 text-sm text-base-700"><li><a class="underline decoration-base-300 hover:text-base-900 hover:decoration-base-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" href="https://nfacademy.id" target="_blank" rel="noreferrer">nfacademy.id</a></li><li><a class="underline decoration-base-300 hover:text-base-900 hover:decoration-base-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" href="https://nurulfikri.ac.id" target="_blank" rel="noreferrer">nurulfikri.ac.id</a></li><li><a class="underline decoration-base-300 hover:text-base-900 hover:decoration-base-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" href="https://tailwindcss.com" target="_blank" rel="noreferrer">tailwindcss.com</a></li><li><a class="underline decoration-base-300 hover:text-base-900 hover:decoration-base-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" href="https://developer.mozilla.org" target="_blank" rel="noreferrer">developer.mozilla.org</a></li><li><a class="underline decoration-base-300 hover:text-base-900 hover:decoration-base-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" href="https://vite.dev" target="_blank" rel="noreferrer">vite.dev</a></li></ul></aside>
        <section class="section-card md:col-span-8">
          <h2 class="text-lg">Main Content</h2>
          <form id="login-form" class="mt-4 max-w-md space-y-3" novalidate>
            <label class="block text-sm font-semibold text-base-700" for="username">Username</label>
            <input id="username" name="username" autocomplete="username" spellcheck="false" required class="w-full rounded-lg border border-base-300 bg-white px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
            <label class="block text-sm font-semibold text-base-700" for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" spellcheck="false" required class="w-full rounded-lg border border-base-300 bg-white px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
            <label class="block text-sm font-semibold text-base-700" for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" minlength="6" required class="w-full rounded-lg border border-base-300 bg-white px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
            <button type="submit" class="btn-primary">Login</button>
            <p id="login-status" class="mt-3 text-sm text-base-700" role="status" aria-live="polite">Fill the form and click login.</p>
          </form>
        </section>
      </main>
      <footer class="section-card"><div class="flex items-center justify-between"><p class="text-sm text-base-700">Created by Student Developer. <span data-year></span></p><div class="flex gap-2"><a class="social-badge" href="https://github.com" target="_blank" rel="noreferrer" aria-label="GitHub">G</a><a class="social-badge" href="https://linkedin.com" target="_blank" rel="noreferrer" aria-label="LinkedIn">in</a><a class="social-badge" href="https://instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram">IG</a></div></div></footer>
    </div>
    <script type="module" src="/src/scripts/shared.ts"></script>
    <script type="module" src="/src/scripts/login.ts"></script>
  </body>
</html>
