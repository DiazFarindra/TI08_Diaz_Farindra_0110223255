<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk Toko Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-add {
            background: #4CAF50;
            color: white;
        }

        .btn-add:hover {
            background: #45a049;
        }

        .btn-display {
            background: #2196F3;
            color: white;
        }

        .btn-display:hover {
            background: #0b7dda;
        }

        .btn-delete {
            background: #f44336;
            color: white;
            flex: none;
            padding: 8px 15px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #da190b;
        }

        .products-section {
            margin-top: 30px;
        }

        .products-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .product-id {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .product-price {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-style: italic;
        }

        #outputDisplay {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Manajemen Produk Toko Online</h1>

        <div class="form-section">
            <h2 style="color: #667eea; margin-bottom: 20px;">Tambah Produk Baru</h2>
            <div class="form-group">
                <label for="productName">Nama Produk:</label>
                <input type="text" id="productName" placeholder="Contoh: Laptop, Smartphone, dll">
            </div>
            <div class="form-group">
                <label for="productPrice">Harga Produk (Rp):</label>
                <input type="number" id="productPrice" placeholder="Contoh: 1200000">
            </div>
            <div class="button-group">
                <button class="btn-add" id="addProductBtn">➕ Tambah Produk</button>
                <button class="btn-display" id="displayProductsBtn">📊 Tampilkan Semua Produk</button>
            </div>
        </div>

        <div id="messageDisplay"></div>

        <div class="products-section">
            <h2>Daftar Produk</h2>
            <div id="productContainer" class="product-list">
                <div class="empty-message">Belum ada produk. Tambahkan produk baru untuk memulai.</div>
            </div>
        </div>

        <div id="outputDisplay" style="display: none;">
            <h3>Output Console:</h3>
            <pre id="consoleOutput"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
