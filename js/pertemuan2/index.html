<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 2 - JavaScript</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 900px;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 10px;
        text-align: left;
      }
      thead {
        background: #f1f5f9;
      }
      tfoot {
        background: #e2e8f0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Data Pegawai</h2>
    <table>
      <thead>
        <tr>
          <th>Nama Pegawai</th>
          <th>Umur</th>
          <th>Jabatan</th>
          <th>Status</th>
          <th>Gaji Pokok</th>
          <th>Tunjangan Jabatan (15%)</th>
          <th>BPJS (10%)</th>
          <th>Tunjangan Keluarga (20%)</th>
        </tr>
      </thead>
      <tbody id="pegawaiBody"></tbody>
      <tfoot id="pegawaiFoot"></tfoot>
    </table>

    <script>
      const nama = "dodi prayodi";
      const umur = 25;
      const jabatan = "manajer";
      const status = "menikah";

      let gapok = 0;
      if (jabatan.toLowerCase() === "manajer") {
        gapok = 15000000;
      } else if (jabatan.toLowerCase() === "asisten manajer") {
        gapok = 10000000;
      } else {
        gapok = 5000000;
      }

      const tunjanganJabatan = 0.15 * gapok;
      const bpjs = 0.1 * gapok;
      const tunjanganKeluarga = status.toLowerCase() === "menikah" ? 0.2 * gapok : 0;
      const totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

      const formatRupiah = (nilai) =>
        new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(nilai);

      const tbody = document.getElementById("pegawaiBody");
      tbody.innerHTML = `
        <tr>
          <td>${nama}</td>
          <td>${umur} tahun</td>
          <td>${jabatan}</td>
          <td>${status}</td>
          <td>${formatRupiah(gapok)}</td>
          <td>${formatRupiah(tunjanganJabatan)}</td>
          <td>${formatRupiah(bpjs)}</td>
          <td>${formatRupiah(tunjanganKeluarga)}</td>
        </tr>
      `;

      const tfoot = document.getElementById("pegawaiFoot");
      tfoot.innerHTML = `
        <tr>
          <td colspan="7">Total Gaji</td>
          <td>${formatRupiah(totalGaji)}</td>
        </tr>
      `;
    </script>
  </body>
</html>
